<script>
/* ============================================================
   Blob Worker bootstrap
   - Works on file:// (no server)
   - Paste your level_worker.js into the string below
   ============================================================ */

let view = {
  zoom: 1.0,         // user zoom multiplier (1 = fit)
  panX: 0,           // in world grid units (not pixels)
  panY: 0,
  isPanning: false,
  panStart: null
};
const strikesAllowed = 9;
const LEVEL_WORKER_SOURCE = `
/* ============================================================
   level_worker.js (Blob worker)
   - Generates densely packed, always-solvable levels
   - Segment length >= 2 edges (prevents stub/dir ambiguity)
   - Two-phase fill: sweepers -> gap-target fill-until-stuck
   ============================================================ */

let jobId = 0;

self.onmessage = (e) => {
  const msg = e.data || {};
  if (msg.type === "start") {
    jobId = msg.jobId;
    runSearch(msg);
  } else if (msg.type === "stop") {
    jobId = msg.jobId; // bump so loops bail
  }
};

/* ---------- RNG ---------- */
function mulberry32(seed){
  let t = seed >>> 0;
  return function(){
    t += 0x6d2b79f5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function rint(rng,a,b){ return a + Math.floor(rng()*(b-a+1)); }
function choice(rng,arr){ return arr[(rng()*arr.length)|0]; }
/* ---------- Helpers (worker) ------------------ */
function neighbors4(N,x,y){
  return [
    {x:x+1,y},{x:x-1,y},{x,y:y+1},{x,y:y-1}
  ].filter(p => dotInBounds(N,p.x,p.y));
}

function pickStartInLargestComponent(rng, N, staticOcc){
  const seen = new Uint8Array(N*N);

  let bestSize = 0;
  let bestStartable = null;       // array of {x,y} that can start
  let bestAll = null;             // array of {x,y} all empty in the component

  for (let y=0;y<N;y++){
    for (let x=0;x<N;x++){
      const id = dId(N,x,y);
      if (seen[id]) continue;
      if (staticOcc.occD[id]) { seen[id]=1; continue; }

      // BFS this empty-dot component
      let head = 0;
      const qx = [x];
      const qy = [y];
      seen[id] = 1;

      const compAll = [];
      const compStartable = [];

      while (head < qx.length){
        const cx = qx[head];
        const cy = qy[head];
        head++;

        compAll.push({x:cx,y:cy});
        if (hasFreeNeighbor(N, staticOcc, cx, cy)) compStartable.push({x:cx,y:cy});

        // neighbors4 inline (faster)
        let nx, ny, nid;

        nx = cx + 1; ny = cy;
        if (nx < N){
          nid = dId(N,nx,ny);
          if (!seen[nid] && !staticOcc.occD[nid]){ seen[nid]=1; qx.push(nx); qy.push(ny); }
          else if (!seen[nid] && staticOcc.occD[nid]){ seen[nid]=1; }
        }

        nx = cx - 1; ny = cy;
        if (nx >= 0){
          nid = dId(N,nx,ny);
          if (!seen[nid] && !staticOcc.occD[nid]){ seen[nid]=1; qx.push(nx); qy.push(ny); }
          else if (!seen[nid] && staticOcc.occD[nid]){ seen[nid]=1; }
        }

        nx = cx; ny = cy + 1;
        if (ny < N){
          nid = dId(N,nx,ny);
          if (!seen[nid] && !staticOcc.occD[nid]){ seen[nid]=1; qx.push(nx); qy.push(ny); }
          else if (!seen[nid] && staticOcc.occD[nid]){ seen[nid]=1; }
        }

        nx = cx; ny = cy - 1;
        if (ny >= 0){
          nid = dId(N,nx,ny);
          if (!seen[nid] && !staticOcc.occD[nid]){ seen[nid]=1; qx.push(nx); qy.push(ny); }
          else if (!seen[nid] && staticOcc.occD[nid]){ seen[nid]=1; }
        }
      }

      // component "size" is all empty dots, but we only keep it if we have any startable
      if (compStartable.length && compAll.length > bestSize){
        bestSize = compAll.length;
        bestAll = compAll;
        bestStartable = compStartable;
      }
    }
  }

  if (!bestStartable || !bestStartable.length) return null;

  // Bias toward deep-interior points of the biggest void:
  // pick among the top K by borderDist (farther from border => more "inside the lake")
  const K = Math.min(32, bestStartable.length);

  // compute borderDist for each, then partial-select top K by simple insertion
  const top = [];
  for (let i=0;i<bestStartable.length;i++){
    const p = bestStartable[i];
    const bd = borderDist(N, p.x, p.y);

    // keep a small list of best K by bd
    let inserted = false;
    for (let j=0;j<top.length;j++){
      if (bd > top[j].bd){
        top.splice(j, 0, {x:p.x,y:p.y,bd});
        inserted = true;
        break;
      }
    }
    if (!inserted) top.push({x:p.x,y:p.y,bd});
    if (top.length > K) top.length = K;
  }

  // random among top K, with a mild skew to the best
  // (square the RNG so it leans toward the start of the list)
  const r = rng();
  const idx = Math.floor((r*r) * top.length);
  return {x: top[idx].x, y: top[idx].y};
}

function largestEmptyComponentStats(N, level){
  // Build a dot-occupancy grid from level.arrows (dots occupied by any arrow)
  const occD = new Uint8Array(N * N);
  for (let i=0;i<level.arrows.length;i++){
    const a = level.arrows[i];
    const chain = a.chain;
    for (let k=0;k<chain.length;k++){
      const p = chain[k];
      // chain dots are always in-bounds by construction
      occD[dId(N, p.x, p.y)] = 1;
    }
  }

  const seen = new Uint8Array(N * N);
  let largest = 0;
  let second = 0;
  let third = 0;
  let emptyCount = 0;

  for (let y=0;y<N;y++){
    for (let x=0;x<N;x++){
      const id = dId(N,x,y);
      if (occD[id]) continue;
      emptyCount++;
      if (seen[id]) continue;

      // BFS on empty component
      let head = 0;
      const qx = [x];
      const qy = [y];
      seen[id] = 1;
      let size = 0;

      while (head < qx.length){
        const cx = qx[head];
        const cy = qy[head];
        head++;
        size++;

        // 4-neighborhood
        // inline bounds checks for speed
        let nx, ny, nid;

        nx = cx + 1; ny = cy;
        if (nx < N){
          nid = dId(N,nx,ny);
          if (!occD[nid] && !seen[nid]){ seen[nid]=1; qx.push(nx); qy.push(ny); }
        }

        nx = cx - 1; ny = cy;
        if (nx >= 0){
          nid = dId(N,nx,ny);
          if (!occD[nid] && !seen[nid]){ seen[nid]=1; qx.push(nx); qy.push(ny); }
        }

        nx = cx; ny = cy + 1;
        if (ny < N){
          nid = dId(N,nx,ny);
          if (!occD[nid] && !seen[nid]){ seen[nid]=1; qx.push(nx); qy.push(ny); }
        }

        nx = cx; ny = cy - 1;
        if (ny >= 0){
          nid = dId(N,nx,ny);
          if (!occD[nid] && !seen[nid]){ seen[nid]=1; qx.push(nx); qy.push(ny); }
        }
      }

      // track top 3 component sizes
      if (size > largest){
        third = second;
        second = largest;
        largest = size;
      } else if (size > second){
        third = second;
        second = size;
      } else if (size > third){
        third = size;
      }
    }
  }

  return {
    emptyCount,
    largest,
    second,
    third
  };
}
/* ---------- Mask stuff ------------ */
function makeRectMask(x0, y0, w, h){
  return (x,y) => (x >= x0 && x < x0+w && y >= y0 && y < y0+h);
}

function chainToVertices(chain){
  const verts = [{ x: chain[0].x, y: chain[0].y }];
  for (let i=2;i<chain.length;i++){
    const a=chain[i-2], b=chain[i-1], c=chain[i];
    const dx1=b.x-a.x, dy1=b.y-a.y;
    const dx2=c.x-b.x, dy2=c.y-b.y;
    if (dx1!==dx2 || dy1!==dy2) verts.push({x:b.x,y:b.y});
  }
  verts.push({ x: chain[chain.length-1].x, y: chain[chain.length-1].y });
  return verts;
}

// Keep the longest tail->head prefix that stays inside mask.
// Then rebuild as a proper arrow later.
// Keep the longest contiguous sub-chain that lies fully inside the mask.
// (Not just a prefix from the tail.)
function clipArrowChainToMask(arrow, inMask){
  const ch = arrow.chain;
  let bestA = -1, bestB = -1;
  let a = -1;

  for (let i = 0; i < ch.length; i++){
    const inside = inMask(ch[i].x, ch[i].y);
    if (inside){
      if (a < 0) a = i;           // start a run
    } else {
      if (a >= 0){
        const b = i - 1;
        if (b - a > bestB - bestA){ bestA = a; bestB = b; }
        a = -1;
      }
    }
  }
  if (a >= 0){
    const b = ch.length - 1;
    if (b - a > bestB - bestA){ bestA = a; bestB = b; }
  }

  if (bestA < 0) return null;

  const outLen = bestB - bestA + 1;
  if (outLen < 3) return null; // need >= 2 edges

  const out = [];
  for (let i = bestA; i <= bestB; i++){
    out.push({ x: ch[i].x, y: ch[i].y });
  }
  return out;
}


function cropAndRebuildArrows(Nbig, arrowsBig, x0, y0, N){
  const inMaskBig = makeRectMask(x0, y0, N, N);
  const kept = [];

  for (const a of arrowsBig){
    const clippedChainBig = clipArrowChainToMask(a, inMaskBig);
    if (!clippedChainBig) continue;

    // remap to local cropped coordinates
    const chainLocal = clippedChainBig.map(p => ({x:p.x - x0, y:p.y - y0}));

    // compress to vertices then rebuild canonical arrow data
    const vertsLocal = chainToVertices(chainLocal);
    const rebuilt = buildArrowFromVertices(N, vertsLocal);
    if (!rebuilt) continue;

    // enforce your minimum (avoid stubs)
    if (rebuilt.chain.length < 5) continue;
    if (violatesSelfAim(N, rebuilt)) continue;

    kept.push(rebuilt);
  }

  return kept;
}
function buildOccDFromArrowsBig(N, arrows){
  const occD = new Uint8Array(N*N);
  for (let i=0;i<arrows.length;i++){
    const ch = arrows[i].chain;
    for (let k=0;k<ch.length;k++){
      const p = ch[k];
      if (p.x>=0 && p.x<N && p.y>=0 && p.y<N) occD[dId(N,p.x,p.y)] = 1;
    }
  }
  return occD;
}

// summed-area table (integral image) for fast window sums
function buildIntegral(N, occD){
  // int[y*(N+1)+x] for x,y in 0..N
  const W = N + 1;
  const I = new Int32Array(W * W);
  for (let y=1;y<=N;y++){
    let rowSum = 0;
    for (let x=1;x<=N;x++){
      rowSum += occD[(y-1)*N + (x-1)];
      I[y*W + x] = I[(y-1)*W + x] + rowSum;
    }
  }
  return I;
}

function rectSum(I, N, x0,y0,w,h){
  const W = N+1;
  const x1 = x0 + w, y1 = y0 + h;
  return I[y1*W + x1] - I[y0*W + x1] - I[y1*W + x0] + I[y0*W + x0];
}

function findBestCropWindow(Nbig, arrowsBig, Nwin){
  const occD = buildOccDFromArrowsBig(Nbig, arrowsBig);
  const I = buildIntegral(Nbig, occD);

  const com = arrowsCenterOfMass(arrowsBig);
  const cx = com.x, cy = com.y;

  let best = { x0: (Nbig-Nwin)>>1, y0: (Nbig-Nwin)>>1, s: -1 };

  const maxX = Nbig - Nwin;
  const maxY = Nbig - Nwin;

  const lambda = 0.015; // tune 0.005..0.03

  for (let y0=0; y0<=maxY; y0++){
    for (let x0=0; x0<=maxX; x0++){
      const s = rectSum(I, Nbig, x0,y0, Nwin,Nwin);

      // distance from window center to COM
      const wx = x0 + Nwin*0.5;
      const wy = y0 + Nwin*0.5;
      const dx = wx - cx, dy = wy - cy;
      const penal = lambda * (dx*dx + dy*dy);

      const score = s - penal;
      if (score > best.s){
        best = { x0, y0, s: score };
      }
    }
  }
  return best;
}

function arrowsCenterOfMass(arrows){
  let sx=0, sy=0, n=0;
  for (const a of arrows){
    for (const p of a.chain){ sx += p.x; sy += p.y; n++; }
  }
  if (!n) return {x:0,y:0};
  return { x: sx/n, y: sy/n };
}
function keepLargestOccupiedComponent(N, arrows){
  if (!arrows.length) return arrows;

  // Build dot occupancy and which arrows touch each dot
  const occ = new Uint8Array(N*N);
  const dotToArrows = Array.from({length:N*N}, () => null);

  for (let ai=0; ai<arrows.length; ai++){
    const ch = arrows[ai].chain;
    for (let k=0; k<ch.length; k++){
      const id = dId(N, ch[k].x, ch[k].y);
      occ[id] = 1;
      (dotToArrows[id] ??= []).push(ai);
    }
  }

  const seen = new Uint8Array(N*N);
  const q = new Int32Array(N*N);

  let bestDots = null;
  let bestSize = 0;

  for (let i=0;i<occ.length;i++){
    if (!occ[i] || seen[i]) continue;

    // BFS occupied component
    let head=0, tail=0;
    q[tail++] = i;
    seen[i] = 1;

    const compDots = [];
    while (head < tail){
      const id = q[head++];
      compDots.push(id);

      const x = id % N;
      const y = (id / N) | 0;

      // 4-neighborhood
      if (x+1 < N){
        const n = id + 1;
        if (occ[n] && !seen[n]){ seen[n]=1; q[tail++]=n; }
      }
      if (x-1 >= 0){
        const n = id - 1;
        if (occ[n] && !seen[n]){ seen[n]=1; q[tail++]=n; }
      }
      if (y+1 < N){
        const n = id + N;
        if (occ[n] && !seen[n]){ seen[n]=1; q[tail++]=n; }
      }
      if (y-1 >= 0){
        const n = id - N;
        if (occ[n] && !seen[n]){ seen[n]=1; q[tail++]=n; }
      }
    }

    if (compDots.length > bestSize){
      bestSize = compDots.length;
      bestDots = compDots;
    }
  }

  if (!bestDots || bestSize === 0) return [];

  // Keep arrows that touch any dot in the largest component
  const keep = new Uint8Array(arrows.length);
  for (let i=0;i<bestDots.length;i++){
    const lst = dotToArrows[bestDots[i]];
    if (!lst) continue;
    for (let j=0;j<lst.length;j++) keep[lst[j]] = 1;
  }

  const out = [];
  for (let i=0;i<arrows.length;i++){
    if (keep[i]) out.push(arrows[i]);
  }
  return out;
}

function initBBoxFromArrow(arrow){
  let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
  for (const p of arrow.chain){
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  return { minX, minY, maxX, maxY };
}

function expandBBoxWithArrow(bb, arrow){
  for (const p of arrow.chain){
    if (p.x < bb.minX) bb.minX = p.x;
    if (p.y < bb.minY) bb.minY = p.y;
    if (p.x > bb.maxX) bb.maxX = p.x;
    if (p.y > bb.maxY) bb.maxY = p.y;
  }
}

function pickFrontierByBlobRim(rng, N, frontier, bb, mode){
  if (!frontier || !frontier.length) return null;

  const cx = (bb.minX + bb.maxX) * 0.5;
  const cy = (bb.minY + bb.maxY) * 0.5;

  // Helper: how "multi-sided" the blob contact is (encourages wrapping vs spokes)
  function sideContactScore(p){
    let sides = 0;
    const x=p.x, y=p.y;
    // NOTE: frontier points are empty dots. We infer blob contact from p.adj,
    // but we also want diversity of contact directions. We approximate it using p.sc and p.adj.
    // If you want exact directionality, we can compute it from staticOcc inside buildFrontier.
    // For now: reward adj>=2 a lot.
    if ((p.adj|0) >= 2) sides += 2;
    if ((p.adj|0) >= 3) sides += 2;
    return sides;
  }

  const SAMP = Math.min(frontier.length, 260);
  let best = null;
  let bestScore = -Infinity;

  for (let i=0;i<SAMP;i++){
    const p = frontier[(rng()*frontier.length)|0];

    const adj = p.adj ?? 0;      // 1..4, blob-touch count (no borders)
    if (adj < 2 && frontier.length > 120) continue;      // <<< BIG: prevents “single-touch launch rays”

    const sc = p.sc ?? 0;        // 0..4 (includes border-as-occupied)
    const bd = borderDist(N, p.x, p.y);

    const dx = p.x - cx, dy = p.y - cy;
    const d2 = dx*dx + dy*dy;

    // Expand = slightly prefer farther rim points but still with high adjacency
    // Fill   = prefer near-center pockets, high adjacency
    const rimness = adj * 35 + sc * 6 + sideContactScore(p) * 12;

    let score;
    if (mode === "expand"){
      score = (d2 * 0.25) + rimness + bd * 1.5 + rng()*2.0;
    } else {
      score = (-d2 * 0.35) + rimness + bd * 2.0 + rng()*2.0;
    }

    if (score > bestScore){
      bestScore = score;
      best = p;
    }
  }

  return best ? {x:best.x, y:best.y} : null;
}


/* ---------- Grid helpers ---------- */
function hId(N,x,y){ return y*(N-1)+x; }
function vId(N,x,y){ return y*N+x; }
function dId(N,x,y){ return y*N+x; }
function hInBounds(N,x,y){ return x>=0 && y>=0 && x < N-1 && y < N; }
function vInBounds(N,x,y){ return x>=0 && y>=0 && x < N   && y < N-1; }
function dotInBounds(N,x,y){ return x>=0 && y>=0 && x < N && y < N; }

const DIRS=[
  {k:"U",dx:0,dy:-1},
  {k:"D",dx:0,dy: 1},
  {k:"L",dx:-1,dy:0},
  {k:"R",dx: 1,dy:0},
];
function dirByKey(k){
  for (let i=0;i<DIRS.length;i++) if (DIRS[i].k===k) return DIRS[i];
  return DIRS[3];
}

function edgeBetweenDots(N, ax,ay, bx,by){
  if (ax===bx){
    const x=ax, y=Math.min(ay,by);
    if (!vInBounds(N,x,y)) return {t:null,id:null};
    return {t:"V", id:vId(N,x,y)};
  } else if (ay===by){
    const y=ay, x=Math.min(ax,bx);
    if (!hInBounds(N,x,y)) return {t:null,id:null};
    return {t:"H", id:hId(N,x,y)};
  }
  return {t:null,id:null};
}
function allOut(N, chain){
  for (let i=0;i<chain.length;i++){
    const p=chain[i];
    if (dotInBounds(N,p.x,p.y)) return false;
  }
  return true;
}
function borderDist(N,x,y){
  const a = x, b = y, c = (N-1)-x, d = (N-1)-y;
  return Math.min(a,b,c,d);
}
/* ---------- Occupancy ---------- */
function makeOcc(N){
  return {
    occH: new Uint8Array((N-1)*N),
    occV: new Uint8Array(N*(N-1)),
    occD: new Uint8Array(N*N),
  };
}
function occupyStatic(occ, arrow, val){
  const EH = arrow.staticEdgesH || [];
  const EV = arrow.staticEdgesV || [];
  const ED = arrow.staticDots   || [];
  for (let i=0;i<EH.length;i++) occ.occH[EH[i]] = val;
  for (let i=0;i<EV.length;i++) occ.occV[EV[i]] = val;
  for (let i=0;i<ED.length;i++) occ.occD[ED[i]] = val;
}
function neighborOccScore(N, staticOcc, x, y){
  let s = 0;
  // treat out-of-bounds as occupied (pushes you away from borders if desired)
  if (x<=0 || staticOcc.occD[dId(N,x-1,y)]) s++;
  if (x>=N-1 || staticOcc.occD[dId(N,x+1,y)]) s++;
  if (y<=0 || staticOcc.occD[dId(N,x,y-1)]) s++;
  if (y>=N-1 || staticOcc.occD[dId(N,x,y+1)]) s++;
  return s; // 0..4
}

/* ---------- Build arrow from vertices ---------- */
function buildArrowFromVertices(N, vertices){
  if (!vertices || vertices.length < 2) return null;

  const chain=[];
  const dots=[];
  const edgesH=[];
  const edgesV=[];

  function pushDot(x,y){
    chain.push({x:x,y:y});
    dots.push(dId(N,x,y));
  }

  pushDot(vertices[0].x, vertices[0].y);

  for (let i=0;i<vertices.length-1;i++){
    const a=vertices[i], b=vertices[i+1];
    if (a.x===b.x && a.y===b.y) continue;

    if (a.x===b.x){
      const x=a.x;
      const step=b.y>a.y?1:-1;
      for (let y=a.y; y!==b.y; y+=step){
        const yEdge=Math.min(y,y+step);
        if (!vInBounds(N,x,yEdge)) return null;
        edgesV.push(vId(N,x,yEdge));
        pushDot(x,y+step);
      }
    } else if (a.y===b.y){
      const y=a.y;
      const step=b.x>a.x?1:-1;
      for (let x=a.x; x!==b.x; x+=step){
        const xEdge=Math.min(x,x+step);
        if (!hInBounds(N,xEdge,y)) return null;
        edgesH.push(hId(N,xEdge,y));
        pushDot(x+step,y);
      }
    } else {
      return null;
    }
  }

  if (chain.length < 2) return null;

  // Determine head direction from last *actual* step (ignore duplicates)
  let i = chain.length - 1;
  while (i>0 && chain[i].x===chain[i-1].x && chain[i].y===chain[i-1].y) i--;
  if (i<=0) return null;

  const p0=chain[i-1], p1=chain[i];
  const dx = Math.sign(p1.x-p0.x);
  const dy = Math.sign(p1.y-p0.y);
  const dirKey = dx===1?"R":dx===-1?"L":dy===1?"D":"U";

  return {
    vertices: vertices,
    chain: chain,
    staticDots: dots,
    staticEdgesH: edgesH,
    staticEdgesV: edgesV,
    dir: dirKey
  };
}

/* ---------- No self-aim: ray ahead must not hit own dots ---------- */
function violatesSelfAim(N, arrow){
  const dir = dirByKey(arrow.dir);
  const head = arrow.chain[arrow.chain.length-1];

  const selfD = new Uint8Array(N*N);
  const sd = arrow.staticDots;
  for (let i=0;i<sd.length;i++) selfD[sd[i]] = 1;

  let x=head.x, y=head.y;
  while (true){
    x += dir.dx; y += dir.dy;
    if (!dotInBounds(N,x,y)) return false;
    if (selfD[dId(N,x,y)]) return true;
  }
}

/* ---------- Snake simulation (same rules as main thread) ---------- */
function simulateSnakeExit(N, staticOcc, arrow, maxSteps){
  const dir=dirByKey(arrow.dir);
  const chain = new Array(arrow.chain.length);
  for (let i=0;i<arrow.chain.length;i++) chain[i] = {x:arrow.chain[i].x, y:arrow.chain[i].y};

  const stepsLimit = maxSteps || (N + chain.length + 50);

  const selfD = new Uint8Array(N*N);
  const selfH = new Uint8Array((N-1)*N);
  const selfV = new Uint8Array(N*(N-1));

  for (let i=0;i<chain.length;i++){
    const p=chain[i];
    if (dotInBounds(N,p.x,p.y)) selfD[dId(N,p.x,p.y)]=1;
    if (i>0){
      const q=chain[i-1];
      const e=edgeBetweenDots(N,q.x,q.y,p.x,p.y);
      if (e.t==="H") selfH[e.id]=1;
      if (e.t==="V") selfV[e.id]=1;
    }
  }

  for (let step=0; step<stepsLimit; step++){
    if (allOut(N, chain)) return {ok:true, steps:step, collision:null};

    const t0=chain[0], t1=chain[1];
    if (dotInBounds(N,t0.x,t0.y)) selfD[dId(N,t0.x,t0.y)]=0;
    const te=edgeBetweenDots(N,t0.x,t0.y,t1.x,t1.y);
    if (te.t==="H") selfH[te.id]=0;
    if (te.t==="V") selfV[te.id]=0;

    const head=chain[chain.length-1];
    const nx=head.x+dir.dx, ny=head.y+dir.dy;

    if (dotInBounds(N,nx,ny)){
      const did=dId(N,nx,ny);
      if (selfD[did]) return {ok:false, steps:step, collision:{kind:"self-dot", x:nx,y:ny}};
      if (staticOcc.occD[did]) return {ok:false, steps:step, collision:{kind:"other-dot", x:nx,y:ny}};
    }

    const he=edgeBetweenDots(N, head.x,head.y, nx,ny);
    if (he.t==="H"){
      if (staticOcc.occH[he.id]) return {ok:false, steps:step, collision:{kind:"other-edge", edgeType:"H", edgeId:he.id}};
      if (selfH[he.id])         return {ok:false, steps:step, collision:{kind:"self-edge",  edgeType:"H", edgeId:he.id}};
    }
    if (he.t==="V"){
      if (staticOcc.occV[he.id]) return {ok:false, steps:step, collision:{kind:"other-edge", edgeType:"V", edgeId:he.id}};
      if (selfV[he.id])         return {ok:false, steps:step, collision:{kind:"self-edge",  edgeType:"V", edgeId:he.id}};
    }

    chain.shift();
    chain.push({x:nx,y:ny});
    if (dotInBounds(N,nx,ny)) selfD[dId(N,nx,ny)]=1;
    if (he.t==="H") selfH[he.id]=1;
    if (he.t==="V") selfV[he.id]=1;
  }

  return {ok:false, steps:stepsLimit, collision:{kind:"timeout"}};
}

/* ---------- Gap utilities ---------- */
function findEmptyDots(N, staticOcc){
  const empties = [];
  for (let y=0;y<N;y++){
    for (let x=0;x<N;x++){
      if (!staticOcc.occD[dId(N,x,y)]) empties.push({x,y});
    }
  }
  return empties;
}
function hasFreeNeighbor(N, staticOcc, x,y){
  for (let i=0;i<DIRS.length;i++){
    const d=DIRS[i];
    const nx=x+d.dx, ny=y+d.dy;
    if (!dotInBounds(N,nx,ny)) continue;
    if (staticOcc.occD[dId(N,nx,ny)]) continue;
    const e=edgeBetweenDots(N,x,y,nx,ny);
    if (!e.t) continue;
    if (e.t==="H" && staticOcc.occH[e.id]) continue;
    if (e.t==="V" && staticOcc.occV[e.id]) continue;
    return true;
  }
  return false;
}

/* ---------- Grow an orthogonal polyline without overlaps ----------
   Rules:
   - segments are >= 2 edges (>= 3 dots) between turns
   - can optionally force start at a given empty dot (gap fill)
--------------------------------------------------------------- */
function growArrowVerticesInFreeSpace(rng, N, style, staticOcc, forcedStart){
  const maxTurns = style.maxTurns || 220;
  const minSeg   = Math.max(2, style.minSeg || 2);          // <<< enforce >=2
  const maxSeg   = Math.max(minSeg, style.maxSeg || 6);
  const allowStraightChance = (style.allowStraightChance ?? 0.05);
  const margin   = style.margin || 0;
  const minEdges = Math.max(2, style.minEdges || 2);        // <<< arrow must be >= 2 edges total
  const maxEdgeLen = style.maxEdgeLen || 900;
  const startTries = style.startTries || 1200;

  let sx=0, sy=0, found=false;

    if (forcedStart){
      sx = forcedStart.x; sy = forcedStart.y;
      const m = style.borderMargin ?? 3;
      found = dotInBounds(N,sx,sy) &&
              !staticOcc.occD[dId(N,sx,sy)] &&
              borderDist(N,sx,sy) >= m;
    } else {
    const cx0 = (N-1) * 0.5;
    const cy0 = (N-1) * 0.5;

    function centeredSample(){
      const g = () => (rng()+rng()+rng()+rng()) * 0.25;
      const spread = 0.22;
      const x = Math.round(cx0 + (g()-0.5) * (N-1) * spread);
      const y = Math.round(cy0 + (g()-0.5) * (N-1) * spread);
      return {
        x: Math.max(margin, Math.min((N-1)-margin, x)),
        y: Math.max(margin, Math.min((N-1)-margin, y))
      };
    }

    for (let t=0;t<startTries;t++){
      if (style.startBias === "center"){
        const p = centeredSample();
        sx = p.x; sy = p.y;
      } else {
        sx = rint(rng, margin, (N-1)-margin);
        sy = rint(rng, margin, (N-1)-margin);
      }

      if (staticOcc.occD[dId(N,sx,sy)]) continue;
      found=true; break;
    }
  }

  if (!found) return null;

  const usedD = new Uint8Array(N*N);
  const usedH = new Uint8Array((N-1)*N);
  const usedV = new Uint8Array(N*(N-1));
  usedD[dId(N,sx,sy)] = 1;

  // How "close to occupied stuff" is this dot? (0..4)
  // Higher means it hugs existing lines/borders more.
  function neighborOccScore(x, y){
    let s = 0;

    // out-of-bounds counts as occupied (helps avoid drifting into borders awkwardly)
    if (x <= 0 || staticOcc.occD[dId(N, x-1, y)]) s++;
    if (x >= N-1 || staticOcc.occD[dId(N, x+1, y)]) s++;
    if (y <= 0 || staticOcc.occD[dId(N, x, y-1)]) s++;
    if (y >= N-1 || staticOcc.occD[dId(N, x, y+1)]) s++;

    return s;
  }

  function dotOk(nx,ny){
    if (!dotInBounds(N,nx,ny)) return false;
    const did = dId(N,nx,ny);
    if (usedD[did]) return false;
    if (staticOcc.occD[did]) return false;
    return true;
  }
  const boundaryBias = style.boundaryBias ?? 0; // 0..1 (prefer tight areas)
  const centerPull = style.centerPull ?? null;
  const interiorBias = style.interiorBias ?? 0; // 0..1 (prefer open void)
  
  function edgeOk(cx,cy,nx,ny){
    if (!dotOk(nx,ny)) return false;
    if (centerPull){
      const dx0 = cx - centerPull.cx, dy0 = cy - centerPull.cy;
      const dx1 = nx - centerPull.cx, dy1 = ny - centerPull.cy;
      const d20 = dx0*dx0 + dy0*dy0;
      const d21 = dx1*dx1 + dy1*dy1;

      // if this step increases distance, sometimes reject it
      if (d21 > d20 && rng() < (centerPull.p || 0.25)) return false;
    }
	const sc = neighborOccScore(nx, ny); // 0..4

	// --- interiorBias: prefer OPEN space (low sc) by rejecting tight moves ---
	if (interiorBias > 0) {
	  // sc: 0 open -> 4 tight. Make rejection grow with sc.
	  const rejectP = interiorBias * (sc / 4);
	  if (rng() < rejectP) return false;
	}

	// --- boundaryBias: prefer STITCHING (high sc) by rejecting open moves ---
	if (boundaryBias > 0) {
	  // reject more when sc is low (open)
	  const rejectP = boundaryBias * ((4 - sc) / 4);
	  if (rng() < rejectP) return false;
	}
  
    const e = edgeBetweenDots(N,cx,cy,nx,ny);
    if (!e.t) return false;
  
    if (e.t==="H"){
      if (usedH[e.id]) return false;
      if (staticOcc.occH[e.id]) return false;
    } else { // "V"
      if (usedV[e.id]) return false;
      if (staticOcc.occV[e.id]) return false;
    }
    return true;
  }


  function commit(cx,cy,nx,ny){
    usedD[dId(N,nx,ny)] = 1;
    const e=edgeBetweenDots(N,cx,cy,nx,ny);
    if (e.t==="H") usedH[e.id]=1;
    if (e.t==="V") usedV[e.id]=1;
  }

  let dir = choice(rng, DIRS);
  const verts=[{x:sx,y:sy}];

  // Ensure first edge exists
  let started=false;
  for (let tries=0; tries<8 && !started; tries++){
    const d = (tries===0) ? dir : DIRS[tries%4];
    const nx=sx+d.dx, ny=sy+d.dy;
    if (edgeOk(sx,sy,nx,ny)){
      commit(sx,sy,nx,ny);
      verts.push({x:nx,y:ny});
      dir = d;
      started=true;
    }
  }
  if (!started) return null;

  let edgesBuilt = 1;
  let turns = 0;

  // Turning behavior knobs:
  // - turnEvery: average "chunk" length in edges before a turn opportunity
  // - turnChance: chance to turn at each opportunity (after meeting min segment)
  const turnEvery   = style.turnEvery   ?? 2;    // 2 => very turny
  const turnChance  = style.turnChance  ?? 0.85; // 0.85 => almost always turn
  const maxStraight = style.maxStraight ?? maxSeg; // safety cap

  while (turns < maxTurns && edgesBuilt < maxEdgeLen){
    const last = verts[verts.length-1];
    let cx = last.x, cy = last.y;

    // We build in small "chunks" so we can turn often.
    // But we still enforce minSeg >= 2 edges between turns.
    let movedThisVertex = 0;

    // Choose a target straight run length for this vertex (keeps some variety)
    const target = Math.min(maxStraight, Math.max(minSeg, rint(rng, minSeg, maxSeg)));

    while (movedThisVertex < target && edgesBuilt < maxEdgeLen){
      const nx = cx + dir.dx, ny = cy + dir.dy;
      if (!edgeOk(cx,cy,nx,ny)) break;
      commit(cx,cy,nx,ny);
      cx = nx; cy = ny;
      edgesBuilt++;
      movedThisVertex++;

      // After we've moved at least minSeg edges from the last turn/vertex,
      // we get frequent opportunities to turn.
      if (movedThisVertex >= minSeg){
        if ((movedThisVertex % turnEvery) === 0){
          // honor allowStraightChance (rarely keep going straight)
          const willConsiderTurn = (rng() >= allowStraightChance);

          if (willConsiderTurn && rng() < turnChance){
            // commit a vertex at the current position (turn happens at this dot)
            verts.push({x:cx,y:cy});

            // pick a perpendicular direction
			// pick a perpendicular direction that hugs existing stuff (higher neighborOccScore),
			// while still being feasible for at least the next step.
			let candA, candB;
			if (dir.k==="U"||dir.k==="D"){ candA = DIRS[2]; candB = DIRS[3]; } // L/R
			else                         { candA = DIRS[0]; candB = DIRS[1]; } // U/D

			function firstStepScore(d){
			  const nx = cx + d.dx, ny = cy + d.dy;
			  if (!edgeOk(cx, cy, nx, ny)) return -1e9;
			  // Prefer stitchiness immediately
			  return neighborOccScore(nx, ny);
			}

			const sA = firstStepScore(candA);
			const sB = firstStepScore(candB);

			// Mostly take the better “hugging” turn, but keep a little entropy
			if (sA === sB){
			  dir = (rng() < 0.5) ? candA : candB;
			} else {
			  const best = (sA > sB) ? candA : candB;
			  const other= (sA > sB) ? candB : candA;
			  dir = (rng() < 0.85) ? best : other;
			}

            turns++;
            movedThisVertex = 0; // reset segment length after a turn
            // continue building from the same (cx,cy) but in new dir
          }
        }
      }
    }

    // If we couldn't move enough to make a valid segment, stop.
    if (movedThisVertex > 0 && movedThisVertex < minSeg) break;

    // If we ended with a straight run (no turn at end), add a vertex here.
    // (But avoid pushing duplicates.)
    const tail = verts[verts.length-1];
    if (!tail || tail.x !== cx || tail.y !== cy){
      verts.push({x:cx,y:cy});
    }

    // If we made zero progress, we’re stuck.
    if (movedThisVertex === 0) break;

    // If we didn't turn during this iteration, count it as a "turn opportunity" consumed.
    // (This keeps maxTurns meaningful.)
    turns++;
  }

  if (edgesBuilt < minEdges) return null;
  if (verts.length < 2) return null;
  return verts;
}
function buildEdgeFrontier(N, staticOcc, edgeBand){
  const out = [];
  for (let y=0;y<N;y++){
    for (let x=0;x<N;x++){
      const id = dId(N,x,y);
      if (staticOcc.occD[id]) continue;
      if (!hasFreeNeighbor(N, staticOcc, x, y)) continue;

      const bd = borderDist(N, x, y);
      if (bd > edgeBand) continue;         // ONLY near edge band

      const sc = neighborOccScore(N, staticOcc, x, y); // 0..4
      if (sc >= 1) out.push({x,y, bd, sc});
    }
  }
  return out;
}

function pickEdgeFrontier(rng, edgeFrontier){
  if (!edgeFrontier.length) return null;
  // bias to bd=0/1 (closest to border)
  let best = null;
  let bestScore = Infinity;
  const SAMP = Math.min(edgeFrontier.length, 128);
  for (let i=0;i<SAMP;i++){
    const p = edgeFrontier[(rng()*edgeFrontier.length)|0];
    // lower is better: bd dominates, then prefer higher sc (stitchiness)
	const targetBd = 2;
	const score =
	  Math.abs(p.bd - targetBd) * 2.2 +   // closest to bd≈2 wins
	  (4 - p.sc) * 0.7 +                  // still like stitching
	  rng() * 0.25;
    if (score < bestScore){ bestScore = score; best = p; }
  }
  return best ? {x:best.x, y:best.y} : null;
}
/* ---------- Blob level then crop approach --------------- */
function generateLevelBlobThenCrop(N, seed){
  // Big working canvas (a bit bigger helps)
  const margin = Math.max(12, Math.floor(N * 0.45)); // was 0.25
  const Nbig = N + margin*2;

  // 1) Generate on big grid
  const big = generateLevelFillUntilStuck(Nbig, seed);
  if (!big || !big.arrows || big.arrows.length < 1) return { N, arrows: [] };

  // 2) Pick best N×N crop window (densest dots)
  const win = findBestCropWindow(Nbig, big.arrows, N);
  const x0 = win.x0;
  const y0 = win.y0;

  // 3) Crop + rebuild
  let cropped = cropAndRebuildArrows(Nbig, big.arrows, x0, y0, N);
  cropped = keepLargestOccupiedComponent(N, cropped); // <<<<<< NEW
  return { N, arrows: cropped };
}


/* ---------- Level generator (fill until stuck) ---------- */
function generateLevelFillUntilStuck(N, seed){
  const rng = mulberry32(seed);
  const staticOcc = makeOcc(N);
  const arrows = [];

  const maxArrows = 9000;
  let blobBB = null;
  // --- Multi-seed count ---
  const seedCount = 1; // <<<<<< single colony

  // --- Seed placement (center-biased) ---
  const cx0 = (N-1) * 0.5;
  const cy0 = (N-1) * 0.5;
  function centeredDot(){
    // average-of-uniforms => approx gaussian-ish
    const g = () => (rng()+rng()+rng()+rng()) * 0.25;
	const spread = 0.22
    const x = Math.round(cx0 + (g()-0.5) * (N-1) * spread);
    const y = Math.round(cy0 + (g()-0.5) * (N-1) * spread);
    return {
      x: Math.max(2, Math.min((N-1)-2, x)),
      y: Math.max(2, Math.min((N-1)-2, y)),
    };
  }


  // Styles (same “language” as your current ones)
  const STYLE_SEED_SWEEP = {
    maxTurns: 240,
    minSeg: 2,
    maxSeg: 10,
    turnEvery: 2,
    turnChance: 0.90,
    allowStraightChance: 0.05,
  
    interiorBias: 0.05,   // almost none
    boundaryBias: 0.60,   // start hugging early
  
    minEdges: 2,
    startBias: "any",
    borderMargin: 2
  };
  

  const STYLE_STITCH = {
    maxTurns: 200,
    minSeg: 2,
    maxSeg: 6,
    turnEvery: 2,
    turnChance: 0.95,
    allowStraightChance: 0.02,
  
    interiorBias: 0.12,
    boundaryBias: 0.65,
  
    minEdges: 2,
    startBias: "any",
    borderMargin: 0
  };
  
const STYLE_BITE = {
  maxTurns: 200,
  minSeg: 2,
  maxSeg: 7,
  turnEvery: 2,
  turnChance: 0.93,
  allowStraightChance: 0.03,

  interiorBias: 0.10,   // don't chase open void hard
  boundaryBias: 0.55,   // stitch around existing blob

  minEdges: 2,
  startBias: "any",
  borderMargin: 0
};


  // --- Place seeds ---
  const seeds = [];
  let seedTries = 0;

  while (seeds.length < seedCount && seedTries < 3000){
    seedTries++;
  
    const s = centeredDot();   // <<<<<< no "anywhere" seeds
    if (staticOcc.occD[dId(N,s.x,s.y)]) continue;
    if (!hasFreeNeighbor(N, staticOcc, s.x, s.y)) continue;
  
	const blobCx = (blobBB.minX + blobBB.maxX) * 0.5;
	const blobCy = (blobBB.minY + blobBB.maxY) * 0.5;

	// pick style
	const baseStyle = (rng() < 0.85) ? STYLE_STITCH : STYLE_BITE;

	// clone + inject centerPull (don’t mutate the constants)
	const style = {
	  ...baseStyle,
	  centerPull: {
		cx: blobCx,
		cy: blobCy,
		p: (baseStyle === STYLE_STITCH) ? 0.45 : 0.25
	  }
	};

	const verts = growArrowVerticesInFreeSpace(rng, N, style, staticOcc, start);
    if (!verts) continue;
  
    const arrow = buildArrowFromVertices(N, verts);
    if (!arrow) continue;
    if (arrow.chain.length < 9) continue;
    if (violatesSelfAim(N, arrow)) continue;
  
    const sim = simulateSnakeExit(N, staticOcc, arrow, N + arrow.chain.length + 80);
    if (!sim.ok) continue;
  
    occupyStatic(staticOcc, arrow, 1);
    arrows.push(arrow);
    seeds.push({x:s.x,y:s.y});
	blobBB = initBBoxFromArrow(arrow);
  }
  

  // If we couldn’t place seeds, bail to avoid empty levels
  if (arrows.length < 1){
    return { N, arrows };
  }
  if (!blobBB) blobBB = initBBoxFromArrow(arrows[0]);
  // --- Frontier growth loop ---
  let frontier = buildFrontier(N, staticOcc);
  let sinceRefresh = 0;

  let fails = 0;
  const maxFails = Math.max(N*N*10, 24000);
  let frontierRefreshEvery = 3;

  while (arrows.length < maxArrows && fails < maxFails){
    if (!frontier.length) break;

    // periodic refresh to keep frontier accurate
    if (sinceRefresh >= frontierRefreshEvery){
      frontier = buildFrontier(N, staticOcc);
      sinceRefresh = 0;
      if (!frontier.length) break;
    }

    // pick a start near one of the seeds
    // Occasionally force exploration away from the current colony
	const mode = (rng() < 0.80) ? "expand" : "fill";
	const start = pickFrontierByBlobRim(rng, N, frontier, blobBB, mode);
	
    if (!start) { fails++; continue; }

    // alternate between "bite into void" and "stitch along edges"
	const style = (rng() < 0.85) ? STYLE_STITCH : STYLE_BITE;

    const verts = growArrowVerticesInFreeSpace(rng, N, style, staticOcc, start);
    if (!verts) { fails++; sinceRefresh++; continue; }

    const arrow = buildArrowFromVertices(N, verts);
    if (!arrow) { fails++; sinceRefresh++; continue; }

    // allow short-ish ones in frontier fill, but keep stubs out
    if (arrow.chain.length < 5) { fails++; sinceRefresh++; continue; }
    if (violatesSelfAim(N, arrow)) { fails++; sinceRefresh++; continue; }

    const sim = simulateSnakeExit(N, staticOcc, arrow, N + arrow.chain.length + 80);
    if (!sim.ok) { fails++; sinceRefresh++; continue; }

    occupyStatic(staticOcc, arrow, 1);
    arrows.push(arrow);
    expandBBoxWithArrow(blobBB, arrow);
    // “re-seed” occasionally so growth doesn’t collapse into one region
    if (rng() < 0.015){
	  const head = arrow.chain[arrow.chain.length - 1];
	  const tail = arrow.chain[0];

	  // Always anchor the new head (where we just expanded).
	  seeds.push({ x: head.x, y: head.y });

	  // Often anchor the tail too (helps wrap around and avoid "fan rays").
	  if (rng() < 0.60) seeds.push({ x: tail.x, y: tail.y });

	  // Sometimes anchor a random interior point to keep variety.
	  if (rng() < 0.25) {
		const p = arrow.chain[(rng() * arrow.chain.length) | 0];
		seeds.push({ x: p.x, y: p.y });
	  }

	  // Keep more anchors than before.
	  while (seeds.length > 64) seeds.shift();
	}

    // successes reset fail counter and slowly reduce refresh cost
    fails = 0;
    sinceRefresh++;
  }
  // --- Phase A2: Edge sweep fill (cheap + effective) ---
if (false){
  const edgeBand = Math.max(2, Math.floor(N * 0.10)); // N=70 => 7
  const EDGE_STYLE = {
    maxTurns: 160,
    minSeg: 2,
    maxSeg: 9,
    turnEvery: 2,
    turnChance: 0.90,
    allowStraightChance: 0.06,
  
    interiorBias: 0.12,   // NEW: a little openness preference
    boundaryBias: 0.55,   // was 0.80 (too clingy)
  
    minEdges: 2,
    startBias: "any",
    borderMargin: 0
  };

  let edgeFrontier = buildEdgeFrontier(N, staticOcc, edgeBand);
  let edgeFails = 0;
  const edgeFailLimit = Math.max(N*N*4, 8000);

  while (edgeFrontier.length && edgeFails < edgeFailLimit && arrows.length < maxArrows){
    const start = pickEdgeFrontier(rng, edgeFrontier);
    if (!start) break;

    const verts = growArrowVerticesInFreeSpace(rng, N, EDGE_STYLE, staticOcc, start);
    if (!verts){ edgeFails++; if ((edgeFails % 12)===0) edgeFrontier = buildEdgeFrontier(N, staticOcc, edgeBand); continue; }

    const arrow = buildArrowFromVertices(N, verts);
    if (!arrow){ edgeFails++; continue; }

    // allow small-ish edge fillers, but no stubs
    if (arrow.chain.length < 5){ edgeFails++; continue; }
    if (violatesSelfAim(N, arrow)){ edgeFails++; continue; }

    const sim = simulateSnakeExit(N, staticOcc, arrow, N + arrow.chain.length + 80);
    if (!sim.ok){ edgeFails++; continue; }

    occupyStatic(staticOcc, arrow, 1);
    arrows.push(arrow);

    edgeFails = 0;
    // refresh occasionally
    if ((arrows.length % 8)===0) edgeFrontier = buildEdgeFrontier(N, staticOcc, edgeBand);
  }
}
  
  
  return { N, arrows };
}


/* ---------- Scoring (coverage + variety) ---------- */
function scoreLevel(level){
  const N = level.N;
  const totalDots = N * N;

  function borderDistLocal(x,y){
    const a = x, b = y, c = (N-1)-x, d = (N-1)-y;
    return Math.min(a,b,c,d);
  }

  let usedDots = 0;
  let centerUsed = 0;
  let avgLen = 0;
  let micro = 0;
  let longish = 0;
  let veryLong = 0;
  let borderUsed = 0;

  // “center box” ~ middle 60%
  const x0 = Math.floor(N * 0.20);
  const x1 = Math.ceil (N * 0.80);
  const y0 = Math.floor(N * 0.20);
  const y1 = Math.ceil (N * 0.80);

  const veryLongThresh = Math.max(26, Math.floor(N * 0.35));

  for (let i=0;i<level.arrows.length;i++){
    const a = level.arrows[i];
    const len = a.chain.length;

    usedDots += len;
    avgLen += len;

    if (len < 9) micro++;
    if (len >= Math.max(16, N * 0.12)) longish++;
    if (len >= veryLongThresh) veryLong++;

    for (let k=0;k<a.chain.length;k++){
      const p = a.chain[k];

      if (p.x>=x0 && p.x<x1 && p.y>=y0 && p.y<y1) centerUsed++;

      // penalize heavy border usage (distance 0 or 1 from border)
      if (borderDistLocal(p.x,p.y) < 2) borderUsed++;
    }
  }

  if (level.arrows.length) avgLen /= level.arrows.length;

  const coverage = usedDots / totalDots;
  const centerArea = (x1-x0) * (y1-y0);
  const centerCoverage = centerArea ? (centerUsed / centerArea) : 0;

  const microPenalty = micro / Math.max(1, level.arrows.length);
  const lengthBonus = Math.min(1, avgLen / Math.max(10, N * 0.08));
  const variety = Math.min(1, (longish / Math.max(1, level.arrows.length)) * 2.0);

  const borderPenalty = borderUsed / Math.max(1, usedDots);

  // NEW: void (largest empty component) penalty
  const stats = largestEmptyComponentStats(N, level);
  const largestEmptyFrac = stats.largest / totalDots;
  const secondEmptyFrac  = stats.second  / totalDots;
  const emptyFrac        = stats.emptyCount / totalDots;

  // NEW: reward *some* very long hero strokes (but cap it)
  const heroBonus = Math.min(1, veryLong / 3) * 0.55;

  // weights: center first, then coverage, then “nice long-ish” lines,
  // punish border-hugging, and punish giant void lakes.
  return (
    centerCoverage   * 4.2 +
    coverage         * 2.2 +
    lengthBonus      * 0.9 +
    variety          * 0.6 +
    heroBonus        * 1.0 -
    microPenalty     * 2.8 -
    borderPenalty    * 2.6 -
    emptyFrac        * 4.0 -
    largestEmptyFrac * 10.0 -
    secondEmptyFrac  * 4.0 +
    level.arrows.length * 0.00015
  );
}

/* ---------- Incremental improvement helpers ---------- */

// Rebuild staticOcc from an arrows array (safe, simpler; optimize later)
function rebuildOccFromArrows(N, arrows){
  const occ = makeOcc(N);
  for (let i=0;i<arrows.length;i++){
    occupyStatic(occ, arrows[i], 1);
  }
  return occ;
}

// Compute dot-occupancy from arrows (for void analysis)
function buildOccDFromArrows(N, arrows){
  const occD = new Uint8Array(N*N);
  for (let i=0;i<arrows.length;i++){
    const ch = arrows[i].chain;
    for (let k=0;k<ch.length;k++){
      const p = ch[k];
      occD[dId(N,p.x,p.y)] = 1;
    }
  }
  return occD;
}

// Return an array of dotIds belonging to the *largest* empty component
function largestEmptyComponentDots(N, occD){
  const seen = new Uint8Array(N*N);
  let best = null;
  let bestSize = 0;

  // BFS queue (dot ids)
  const q = new Int32Array(N*N);

  for (let y=0;y<N;y++){
    for (let x=0;x<N;x++){
      const id0 = dId(N,x,y);
      if (occD[id0] || seen[id0]) continue;

      let head = 0, tail = 0;
      q[tail++] = id0;
      seen[id0] = 1;

      // store component ids in a normal array (size varies)
      const comp = [];
      while (head < tail){
        const id = q[head++];
        comp.push(id);

        const cx = id % N;
        const cy = (id / N) | 0;

        // 4-neighborhood
        let nid;

        if (cx+1 < N){
          nid = id + 1;
          if (!seen[nid] && !occD[nid]){ seen[nid]=1; q[tail++] = nid; }
          else if (!seen[nid] && occD[nid]){ seen[nid]=1; }
        }
        if (cx-1 >= 0){
          nid = id - 1;
          if (!seen[nid] && !occD[nid]){ seen[nid]=1; q[tail++] = nid; }
          else if (!seen[nid] && occD[nid]){ seen[nid]=1; }
        }
        if (cy+1 < N){
          nid = id + N;
          if (!seen[nid] && !occD[nid]){ seen[nid]=1; q[tail++] = nid; }
          else if (!seen[nid] && occD[nid]){ seen[nid]=1; }
        }
        if (cy-1 >= 0){
          nid = id - N;
          if (!seen[nid] && !occD[nid]){ seen[nid]=1; q[tail++] = nid; }
          else if (!seen[nid] && occD[nid]){ seen[nid]=1; }
        }
      }

      if (comp.length > bestSize){
        bestSize = comp.length;
        best = comp;
      }
    }
  }
  return best || [];
}

// Score how much an arrow borders a given empty-set (higher => good candidate to remove)
function arrowBorderScore(N, arrow, emptyMark){
  let s = 0;
  const ch = arrow.chain;
  for (let i=0;i<ch.length;i++){
    const p = ch[i];
    const x = p.x, y = p.y;

    // check 4 neighbors; if empty, count it
    if (x>0   && emptyMark[dId(N,x-1,y)]) s++;
    if (x<N-1 && emptyMark[dId(N,x+1,y)]) s++;
    if (y>0   && emptyMark[dId(N,x,y-1)]) s++;
    if (y<N-1 && emptyMark[dId(N,x,y+1)]) s++;
  }
  return s;
}

// Remove k arrows biased to those bordering largest void
function removeVoidBoundaryArrows(rng, N, arrows, k){
  if (arrows.length <= k) return arrows.slice(0, Math.max(0, arrows.length-k));

  const occD = buildOccDFromArrows(N, arrows);
  const voidDots = largestEmptyComponentDots(N, occD);
  if (!voidDots.length) return arrows.slice();

  const emptyMark = new Uint8Array(N*N);
  for (let i=0;i<voidDots.length;i++) emptyMark[voidDots[i]] = 1;

  // Score each arrow; keep top candidates
  const scored = [];
  for (let i=0;i<arrows.length;i++){
    const sc = arrowBorderScore(N, arrows[i], emptyMark);
    if (sc > 0) scored.push({i, sc});
  }
  if (!scored.length) return arrows.slice();

  scored.sort((a,b)=>b.sc-a.sc);

  // pick removals from top M with slight randomness
  const M = Math.min(scored.length, Math.max(8, k*6));
  const pickPool = scored.slice(0, M);

  const removeSet = new Uint8Array(arrows.length);
  let removed = 0;
  while (removed < k && pickPool.length){
    // biased random: square
    const r = rng(); 
    const idx = Math.floor((r*r) * pickPool.length);
    const ai = pickPool[idx].i;

    if (!removeSet[ai]){
      removeSet[ai] = 1;
      removed++;
    }
    pickPool.splice(idx, 1);
  }

  const kept = [];
  for (let i=0;i<arrows.length;i++){
    if (!removeSet[i]) kept.push(arrows[i]);
  }
  return kept;
}

// Run your gap-fill phase on an existing (partial) board
function gapFillFromOcc(rng, N, staticOcc, arrows, budgetIters){
  let gapFails = 0;
  const gapFailLimit = Math.max(budgetIters|0, N*N*2);

  while (gapFails < gapFailLimit){
	let anyEmpty = false;
	let anyStartable = false;

	for (let y=0;y<N;y++){
	  for (let x=0;x<N;x++){
		if (!staticOcc.occD[dId(N,x,y)]) {
		  anyEmpty = true;
		  if (hasFreeNeighbor(N, staticOcc, x, y)) { anyStartable = true; break; }
		}
	  }
	  if (anyStartable) break;
	}
	if (!anyEmpty) break;
	if (!anyStartable) break;

    const start = pickStartInLargestComponent(rng, N, staticOcc);
    if (!start) break;

	const lakeMode = (rng() < 0.75);

	const style = lakeMode ? {
	  // invade the biggest void
	  maxTurns: 220,
	  minSeg: 2,
	  maxSeg: 10,
	  turnEvery: 2,
	  turnChance: 0.88,
	  allowStraightChance: 0.06,

	  interiorBias: 0.85,
	  boundaryBias: 0.00,

	  minEdges: 2,
	  startBias: "center",
	  borderMargin: 0
	} : {
	  // stitch small pockets after the lake is reduced
	  maxTurns: 160,
	  minSeg: 2,
	  maxSeg: 6,
	  turnEvery: 2,
	  turnChance: 0.92,
	  allowStraightChance: 0.04,

	  interiorBias: 0.00,
	  boundaryBias: 0.70,

	  minEdges: 2,
	  startBias: "any",
	  borderMargin: 0
	};


    const verts = growArrowVerticesInFreeSpace(rng, N, style, staticOcc, start);
    if (!verts) { gapFails++; continue; }

    const arrow = buildArrowFromVertices(N, verts);
    if (!arrow) { gapFails++; continue; }
    if (arrow.chain.length < 5) { gapFails++; continue; }
    if (violatesSelfAim(N, arrow)) { gapFails++; continue; }

    // Important: solvable given current occupancy
    const sim = simulateSnakeExit(N, staticOcc, arrow, N + arrow.chain.length + 80);
    if (!sim.ok) { gapFails++; continue; }

    occupyStatic(staticOcc, arrow, 1);
    arrows.push(arrow); // append (preserves reverse-order solvability)
    gapFails = 0;
  }
}

// Build a list of "frontier" empty dots: empty and startable, adjacent to occupied stuff.
function occupiedNeighborCount(N, staticOcc, x, y){
  let s = 0;
  if (x > 0   && staticOcc.occD[dId(N, x-1, y)]) s++;
  if (x < N-1 && staticOcc.occD[dId(N, x+1, y)]) s++;
  if (y > 0   && staticOcc.occD[dId(N, x, y-1)]) s++;
  if (y < N-1 && staticOcc.occD[dId(N, x, y+1)]) s++;
  return s; // 0..4, *no border counting*
}

function buildFrontier(N, staticOcc){
  const out = [];
  for (let y=0;y<N;y++){
    for (let x=0;x<N;x++){
      const id = dId(N,x,y);
      if (staticOcc.occD[id]) continue;
      if (!hasFreeNeighbor(N, staticOcc, x, y)) continue;

      // CRITICAL: must touch existing occupancy (blob adjacency)
      const adj = occupiedNeighborCount(N, staticOcc, x, y);
      if (adj <= 0) continue;

      // Keep the "stitchiness" score around (how trapped it is)
      // (this can still treat borders as occupied if you like)
      const sc = neighborOccScore(N, staticOcc, x, y);

      out.push({ x, y, sc, adj });
    }
  }
  return out;
}


function manhattan(a,b){ return Math.abs(a.x-b.x)+Math.abs(a.y-b.y); }

// Pick a frontier point biased toward being near one of the seeds.
// Also mildly biases toward deeper interior (higher borderDist) so we don't only paint edges.
function pickFrontierNearSeeds(rng, N, frontier, seeds){
  if (!frontier.length) return null;

  const SAMP = Math.min(frontier.length, 160);
  let best = null;
  let bestScore = Infinity;

  for (let i=0;i<SAMP;i++){
    const p = frontier[(rng()*frontier.length)|0];

    // distance to nearest seed (NOT a random seed)
    let minDist = 1e9;
    for (let s=0;s<seeds.length;s++){
      const dx = Math.abs(p.x - seeds[s].x);
      const dy = Math.abs(p.y - seeds[s].y);
      const d = dx + dy;
      if (d < minDist) minDist = d;
    }

    const bd = borderDist(N, p.x, p.y);   // interior preference
    const stitch = (4 - p.sc);            // prefer higher sc a bit (lower stitch)

    // Lower is better:
    // - minDist small = near *some* seed (good)
    // - stitch small = more "stitchy" (good)
    // - bd large = interior (good)
    const score = minDist * 1.0 + stitch * 0.8 - bd * 0.20 + rng()*0.25;

    if (score < bestScore){
      bestScore = score;
      best = p;
    }
  }

  return best ? {x:best.x, y:best.y} : null;
}
// Pick a frontier point that is FAR from the current colony (exploration mode).
// We maximize distance-to-nearest-seed (with a mild preference for interior).
function pickFrontierFarFromSeeds(rng, N, frontier, seeds){
  if (!frontier.length) return null;

  const SAMP = Math.min(frontier.length, 256);
  let best = null;
  let bestScore = -Infinity;

  for (let i=0;i<SAMP;i++){
    const p = frontier[(rng()*frontier.length)|0];

    // distance to nearest seed
    let dmin = Infinity;
    for (let s=0; s<seeds.length; s++){
      const sd = Math.abs(p.x - seeds[s].x) + Math.abs(p.y - seeds[s].y);
      if (sd < dmin) dmin = sd;
    }

    const bd = borderDist(N, p.x, p.y);   // higher is more interior
    // score: prefer far-from-colony, slightly prefer interior, and a little randomness
    const score = dmin * 1.0 + bd * 0.25 + rng() * 0.5;

    if (score > bestScore){
      bestScore = score;
      best = p;
    }
  }

  return best ? {x:best.x, y:best.y} : null;
}

/* ---------- Grid helpers ---------- */
function hId(N,x,y){ return y*(N-1)+x; }
function vId(N,x,y){ return y*N+x; }
function dId(N,x,y){ return y*N+x; }
function hInBounds(N,x,y){ return x>=0 && y>=0 && x < N-1 && y < N; }
function vInBounds(N,x,y){ return x>=0 && y>=0 && x < N   && y < N-1; }
function dotInBounds(N,x,y){ return x>=0 && y>=0 && x < N && y < N; }

const DIRS=[
  {k:"U",dx:0,dy:-1},
  {k:"D",dx:0,dy: 1},
  {k:"L",dx:-1,dy:0},
  {k:"R",dx: 1,dy:0},
];
function dirByKey(k){ return DIRS.find(d=>d.k===k) || DIRS[3]; }

function edgeBetweenDots(N, ax,ay, bx,by){
  if (ax===bx){
    const x=ax, y=Math.min(ay,by);
    if (!vInBounds(N,x,y)) return {t:null,id:null};
    return {t:"V", id:vId(N,x,y)};
  } else if (ay===by){
    const y=ay, x=Math.min(ax,bx);
    if (!hInBounds(N,x,y)) return {t:null,id:null};
    return {t:"H", id:hId(N,x,y)};
  }
  return {t:null,id:null};
}
function allOut(N, chain){
  for (const p of chain) if (dotInBounds(N,p.x,p.y)) return false;
  return true;
}
/* ---------- Occupancy (for collision checking during moves) ---------- */
function makeOcc(N){
  return {
    occH: new Uint8Array((N-1)*N),
    occV: new Uint8Array(N*(N-1)),
    occD: new Uint8Array(N*N),
  };
}
function occupyStatic(occ, arrow, val){
  const EH = arrow.staticEdgesH || [];
  const EV = arrow.staticEdgesV || [];
  const ED = arrow.staticDots   || [];
  for (let i=0;i<EH.length;i++) occ.occH[EH[i]] = val;
  for (let i=0;i<EV.length;i++) occ.occV[EV[i]] = val;
  for (let i=0;i<ED.length;i++) occ.occD[ED[i]] = val;
}

function simulateSnakeExit(N, staticOcc, arrow, maxSteps){
  const dir=dirByKey(arrow.dir);
  const chain = arrow.chain.map(p=>({x:p.x,y:p.y}));
  const stepsLimit = maxSteps ?? (N + chain.length + 50);

  const selfD = new Uint8Array(N*N);
  const selfH = new Uint8Array((N-1)*N);
  const selfV = new Uint8Array(N*(N-1));

  for (let i=0;i<chain.length;i++){
    const p=chain[i];
    if (dotInBounds(N,p.x,p.y)) selfD[dId(N,p.x,p.y)]=1;
    if (i>0){
      const q=chain[i-1];
      const e=edgeBetweenDots(N,q.x,q.y,p.x,p.y);
      if (e.t==="H") selfH[e.id]=1;
      if (e.t==="V") selfV[e.id]=1;
    }
  }

  for (let step=0; step<stepsLimit; step++){
    if (allOut(N, chain)) return {ok:true, steps:step, collision:null};

    const t0=chain[0], t1=chain[1];
    if (dotInBounds(N,t0.x,t0.y)) selfD[dId(N,t0.x,t0.y)]=0;
    const te=edgeBetweenDots(N,t0.x,t0.y,t1.x,t1.y);
    if (te.t==="H") selfH[te.id]=0;
    if (te.t==="V") selfV[te.id]=0;

    const head=chain[chain.length-1];
    const nx=head.x+dir.dx, ny=head.y+dir.dy;

    if (dotInBounds(N,nx,ny)){
      const did=dId(N,nx,ny);
      if (selfD[did]) return {ok:false, steps:step, collision:{kind:"self-dot", x:nx,y:ny}};
      if (staticOcc.occD[did]) return {ok:false, steps:step, collision:{kind:"other-dot", x:nx,y:ny}};
    }

    const he=edgeBetweenDots(N, head.x,head.y, nx,ny);
    if (he.t==="H"){
      if (staticOcc.occH[he.id]) return {ok:false, steps:step, collision:{kind:"other-edge", edgeType:"H", edgeId:he.id}};
      if (selfH[he.id])         return {ok:false, steps:step, collision:{kind:"self-edge",  edgeType:"H", edgeId:he.id}};
    }
    if (he.t==="V"){
      if (staticOcc.occV[he.id]) return {ok:false, steps:step, collision:{kind:"other-edge", edgeType:"V", edgeId:he.id}};
      if (selfV[he.id])         return {ok:false, steps:step, collision:{kind:"self-edge",  edgeType:"V", edgeId:he.id}};
    }

    chain.shift();
    chain.push({x:nx,y:ny});
    if (dotInBounds(N,nx,ny)) selfD[dId(N,nx,ny)]=1;
    if (he.t==="H") selfH[he.id]=1;
    if (he.t==="V") selfV[he.id]=1;
  }

  return {ok:false, steps:stepsLimit, collision:{kind:"timeout"}};
}

function stopPool(jobId){
  for (const w of pool){
    try { w.postMessage({ type:"stop", jobId }); } catch {}
  }
}

function normalizeArrowFromWorker(a, id){
  const vertices = (a.vertices || []).map(p => ({x:p.x, y:p.y}));
  const chain    = (a.chain    || []).map(p => ({x:p.x, y:p.y}));

  let staticDots = a.staticDots;
  let staticEdgesH = a.staticEdgesH;
  let staticEdgesV = a.staticEdgesV;

  if (!staticDots || !staticEdgesH || !staticEdgesV){
    const dots = [];
    const eh = [];
    const ev = [];
    for (let i=0;i<chain.length;i++){
      const p=chain[i];
      dots.push(dId(game.N, p.x, p.y));
      if (i>0){
        const q=chain[i-1];
        const e=edgeBetweenDots(game.N,q.x,q.y,p.x,p.y);
        if (e.t==="H") eh.push(e.id);
        if (e.t==="V") ev.push(e.id);
      }
    }
    staticDots = staticDots || dots;
    staticEdgesH = staticEdgesH || eh;
    staticEdgesV = staticEdgesV || ev;
  }

  return {
    id,
    vertices,
    chain,
    staticDots,
    staticEdgesH,
    staticEdgesV,
    dir: a.dir || "R",
    blocked: false,
    alive: true,
  };
}

function setLevelFromWorker(level){
  const N = level.N;
  game = {
    N,
    arrows: level.arrows.map((a,i)=>normalizeArrowFromWorker(a,i)),
    strikes: 0,
    anim: null,
    debugCollision: null,
    padding: 24,
  };
  updateHud();
  draw();
}

function startSearch({N, seed}){
  if (!pool.length) makePool();

  currentJob++;
  const jobId = currentJob;
  stopPool(jobId);

  setStatus("Generating…");
  game = { N, arrows: [], strikes: 0, anim: null, debugCollision: null, padding: 24 };
  updateHud();
  draw();

  let bestSoFar = null;
  let lastPreviewAt = 0;
  let doneCount = 0;

  // give it more time; density is a hard optimization problem
  const timeMs = (navigator.userAgent.includes("Android") || navigator.userAgent.includes("iPhone")) ? 2500 : 5000;


  pool.forEach((w, i) => {
    w.onmessage = (e) => {
      const msg = e.data;
      if (!msg || msg.jobId !== jobId) return;

      if (msg.type === "best" && msg.best && msg.best.level){
        if (!bestSoFar || msg.best.score > bestSoFar.score){
          bestSoFar = msg.best;
          const now = performance.now();
		  if (now - lastPreviewAt > 150) {
		    lastPreviewAt = now;
		    setStatus("Searching…");
		    setLevelFromWorker(bestSoFar.level);
		  }
        }
      }

      if (msg.type === "done"){
        doneCount++;
        if (msg.best && msg.best.level){
          if (!bestSoFar || msg.best.score > bestSoFar.score) bestSoFar = msg.best;
        }
        if (doneCount === pool.length){
          if (bestSoFar && bestSoFar.level){
            setStatus("Ready");
            setLevelFromWorker(bestSoFar.level);
          } else {
            setStatus("Failed");
            alert("Generation failed. Try a different seed or lower N.");
          }
          stopPool(jobId);
        }
      }
    };

    w.postMessage({
      type: "start",
      jobId,
      N,
      seed: (seed + i * 1013) | 0,
      timeMs
    });
  });
}

/* ---------- Gameplay: moving + bounce ---------- */
function rebuildOccWithoutArrow(N, arrows, skipId){
  const occ=makeOcc(N);
  for (const a of arrows){
    if (!a.alive) continue;
    if (a.id===skipId) continue;
    occupyStatic(occ,a,1);
  }
  return occ;
}

function startMove(id){
  const a = game.arrows[id];
  if (!a || !a.alive) return;

  game.debugCollision = null;

  const occWithoutSelf = rebuildOccWithoutArrow(game.N, game.arrows, id);
  const sim = simulateSnakeExit(game.N, occWithoutSelf, a, game.N + a.chain.length + 80);

  game.anim = {
    arrowId: id,
    dir: dirByKey(a.dir),

    // forward motion timing
    startedAt: performance.now(),
    speedDotsPerSec: 30,
    alpha: 0,
    stepCount: 0,

    // the chain we animate (mutable)
    chain: a.chain.map(p => ({x:p.x, y:p.y})),

    // prev/next snapshots for interpolation
    prevChain: a.chain.map(p => ({x:p.x, y:p.y})),
    nextChain: a.chain.map(p => ({x:p.x, y:p.y})),

    // collision info
    willCollide: !sim.ok,
    collideAtStep: sim.ok ? null : sim.steps,
    collision: sim.ok ? null : sim.collision,

    // phase control
    phase: "forward",

    // HISTORY: one record per forward step so we can undo perfectly
    history: [], // each: { tail:{x,y}, head:{x,y} }

    // bounce settings
    bounceSpeedMul: 1.3,
    bounceStartedAt: null,
    bounceStepsDone: 0,

    // snapback target: how many steps to undo (we'll compute at collision)
    bounceTargetSteps: 0,

    // original chain for snap-back (after bounce)
    originChain: a.chain.map(p => ({x:p.x, y:p.y})),
  };

  requestAnimationFrame(tick);
}

function interpChainForDraw(){
  const anim = game.anim;
  if (!anim) return null;

  // Nokia-snake rule:
  // keep every corner perfectly 90° by snapping all intermediate vertices to integer grid.
  // Only the head moves fractionally along its current direction (and optionally the tail).
  const a = Math.max(0, Math.min(1, anim.alpha || 0));

  const chain = anim.chain;           // integer grid positions (after last committed step)
  const out = chain.map(p => ({ x: p.x, y: p.y }));

  const n = out.length;
  if (n < 2) return out;

  // Move head fractionally forward along direction.
  // We do NOT move other points, so corners stay rigid.
  const dir = anim.dir;
  out[n - 1] = {
    x: out[n - 1].x + dir.dx * a,
    y: out[n - 1].y + dir.dy * a
  };

  // Optional: move tail fractionally forward too (so the whole snake "slides").
  // This still keeps corners crisp because the tail segment is straight.
  // If you want the tail to stay perfectly snapped, set this to false.
  const SLIDE_TAIL = true;

  if (SLIDE_TAIL && n >= 2){
    // tail moves toward second point
    const t0 = out[0];
    const t1 = out[1];
    const dx = Math.sign(t1.x - t0.x);
    const dy = Math.sign(t1.y - t0.y);
    out[0] = { x: t0.x + dx * a, y: t0.y + dy * a };
  }

  return out;
}


function tick(now){
  if (!game || !game.anim) return;
  const anim = game.anim;
  const arrow = game.arrows[anim.arrowId];
  if (!arrow) { game.anim = null; return; }

  // -------------------------
  // FORWARD
  // -------------------------
  if (anim.phase === "forward"){
    const dt = (now - anim.startedAt) / 1000;
    const pos = dt * anim.speedDotsPerSec;
    const targetStep = Math.floor(pos);
    anim.alpha = pos - targetStep;

    while (anim.stepCount < targetStep){
      // If we are about to collide, trigger bounce WITHOUT doing the colliding step.
      if (anim.willCollide && anim.stepCount >= anim.collideAtStep){
        // turn red immediately
        arrow.blocked = true;
        game.debugCollision = anim.collision;

        game.strikes++;
        updateHud();
        if (game.strikes >= strikesAllowed) alert("Game over ("+strikesAllowed+" strikes).");

        // Decide how far to bounce back:
        // "reverse to just before the last corner" = undo the last straight run - 1.
        // We can compute last straight run from the CURRENT chain.
        const ch = anim.chain;
        const n = ch.length;

        let runEdges = 1;
        for (let i = n - 1; i >= 2; i--){
          const dx1 = ch[i].x - ch[i-1].x;
          const dy1 = ch[i].y - ch[i-1].y;
          const dx0 = ch[i-1].x - ch[i-2].x;
          const dy0 = ch[i-1].y - ch[i-2].y;
          if (dx1 === dx0 && dy1 === dy0) runEdges++;
          else break;
        }

        // Undo almost to the corner, clamp to keep it snappy.
        // Also cannot undo more than we actually moved.
        const want = Math.max(1, Math.min(runEdges - 1, 10));
        anim.bounceTargetSteps = Math.min(want, anim.history.length);

        anim.phase = "bounce";
        anim.bounceStartedAt = now;
        anim.bounceStepsDone = 0;

        // Set interpolation to "no movement" at the moment of collision
        anim.prevChain = anim.chain.map(p => ({x:p.x, y:p.y}));
        anim.nextChain = anim.chain.map(p => ({x:p.x, y:p.y}));
        anim.alpha = 0;

        draw();
        requestAnimationFrame(tick);
        return;
      }

      // Normal forward step:
      // Save snapshots for interpolation
      anim.prevChain = anim.chain.map(p => ({x:p.x, y:p.y}));

      // Record history to allow perfect undo
      const tail = anim.chain[0];
      const head = anim.chain[anim.chain.length - 1];
      const newHead = { x: head.x + anim.dir.dx, y: head.y + anim.dir.dy };
      anim.history.push({ tail: {x:tail.x, y:tail.y}, head: {x:newHead.x, y:newHead.y} });

      // Apply snake step
      anim.chain.shift();
      anim.chain.push(newHead);

      anim.nextChain = anim.chain.map(p => ({x:p.x, y:p.y}));

      anim.stepCount++;
    }

    // Win condition
    if (!anim.willCollide && allOut(game.N, anim.chain)){
      arrow.alive = false;
      game.anim = null;
      updateHud();
      draw();
      if (game.arrows.every(x => !x.alive)) alert("Cleared! 🎯");
      return;
    }

    draw();
    requestAnimationFrame(tick);
    return;
  }

  // -------------------------
  // BOUNCE (perfect undo)
  // -------------------------
  if (anim.phase === "bounce"){
    if (anim.bounceStartedAt == null) anim.bounceStartedAt = now;

    const bounceDps = anim.speedDotsPerSec * (anim.bounceSpeedMul || 1.3);
    const dt = (now - anim.bounceStartedAt) / 1000;
    const targetUndo = Math.min(anim.bounceTargetSteps, Math.floor(dt * bounceDps));

    while (anim.bounceStepsDone < targetUndo){
      if (anim.history.length === 0) break;

      anim.prevChain = anim.chain.map(p => ({x:p.x, y:p.y}));

      const rec = anim.history.pop(); // last forward step
      // Undo: remove head, re-add tail
      anim.chain.pop();
      anim.chain.unshift({ x: rec.tail.x, y: rec.tail.y });

      anim.nextChain = anim.chain.map(p => ({x:p.x, y:p.y}));

      anim.bounceStepsDone++;
      anim.stepCount = Math.max(0, anim.stepCount - 1);
    }

    // Interpolate within the current undo step
    // (Use fractional time to keep it smooth)
    const fracPos = (dt * bounceDps) - targetUndo;
    anim.alpha = Math.max(0, Math.min(1, fracPos));

    draw();

    if (anim.bounceStepsDone >= anim.bounceTargetSteps || anim.history.length === 0){
      // Snap back to original placement (still red)
      arrow.chain = anim.originChain.map(p => ({x:p.x, y:p.y}));
      game.anim = null;
      draw();
      return;
    }

    requestAnimationFrame(tick);
    return;
  }
}


/* ---------- Hit testing (click anywhere) ---------- */
function distPointToSegment2(px,py,x0,y0,x1,y1){
  const vx=x1-x0, vy=y1-y0;
  const wx=px-x0, wy=py-y0;
  const c1=vx*wx+vy*wy;
  if (c1<=0) return (px-x0)**2+(py-y0)**2;
  const c2=vx*vx+vy*vy;
  if (c2<=c1) return (px-x1)**2+(py-y1)**2;
  const t=c1/c2;
  const bx=x0+t*vx, by=y0+t*vy;
  return (px-bx)**2+(py-by)**2;
}
function pointInTri(px,py, ax,ay, bx,by, cx,cy){
  const v0x=cx-ax, v0y=cy-ay;
  const v1x=bx-ax, v1y=by-ay;
  const v2x=px-ax, v2y=py-ay;
  const dot00=v0x*v0x+v0y*v0y;
  const dot01=v0x*v1x+v0y*v1y;
  const dot02=v0x*v2x+v0y*v2y;
  const dot11=v1x*v1x+v1y*v1y;
  const dot12=v1x*v2x+v1y*v2y;
  const invDen = 1 / (dot00*dot11 - dot01*dot01);
  const u = (dot11*dot02 - dot01*dot12) * invDen;
  const v = (dot00*dot12 - dot01*dot02) * invDen;
  return (u>=0) && (v>=0) && (u+v<=1);
}
function pickArrowAt(px,py){
  if (!game) return null;

  const {N} = game;

  // Match draw(): compute fit cell and origin
  const padPx = 18;
  const size = Math.min(canvas.width, canvas.height);
  const fitCell = (size - 2*padPx) / (N - 1);
  const cell = fitCell * view.zoom;

  const boardW = (N - 1) * cell;
  const boardH = (N - 1) * cell;

  const originX = (canvas.width  - boardW) * 0.5 - view.panX * cell;
  const originY = (canvas.height - boardH) * 0.5 - view.panY * cell;

  function sx(x){ return originX + x * cell; }
  function sy(y){ return originY + y * cell; }

  const lineW = Math.max(2.0, cell * 0.28);
  const thresh = Math.max(10, lineW * 2.0);

  let best={id:-1,d2:Infinity};

  for (const a of game.arrows){
    if (!a.alive) continue;

    const chain=a.chain;
    for (let i=1;i<chain.length;i++){
      const p0=chain[i-1], p1=chain[i];
      const x0=sx(p0.x), y0=sy(p0.y);
      const x1=sx(p1.x), y1=sy(p1.y);
      const d2=distPointToSegment2(px,py,x0,y0,x1,y1);
      if (d2<best.d2){ best={id:a.id,d2}; }
    }

    // head triangle
    const v=a.vertices;
    const n=v.length;
    if (n >= 2){
      const pPrev=v[n-2], pTip=v[n-1];
      const ux=Math.sign(pTip.x-pPrev.x), uy=Math.sign(pTip.y-pPrev.y);
      const tipX=sx(pTip.x), tipY=sy(pTip.y);
      const headLen=Math.max(9,cell*0.9);
      const headW=headLen*0.55;
      const pxn=-uy, pyn=ux;
      const ax=tipX, ay=tipY;
      const bx=tipX-ux*headLen+pxn*headW;
      const by=tipY-uy*headLen+pyn*headW;
      const cx=tipX-ux*headLen-pxn*headW;
      const cy=tipY-uy*headLen-pyn*headW;
      if (pointInTri(px,py, ax,ay,bx,by,cx,cy)) return a.id;
    }
  }

  if (best.id!==-1 && best.d2<=thresh*thresh) return best.id;
  return null;
}


function tryClickArrow(id){
  if (!game || game.anim) return;
  const a=game.arrows[id];
  if (!a || !a.alive) return;
  startMove(id);
}

/* ---------- Rendering ---------- */
function drawArrowHead(ctx, tipX, tipY, ux, uy, headLen, headW, color){
  const px=-uy, py=ux;
  const bx=tipX-ux*headLen+px*headW;
  const by=tipY-uy*headLen+py*headW;
  const cx=tipX-ux*headLen-px*headW;
  const cy=tipY-uy*headLen-py*headW;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(tipX,tipY);
  ctx.lineTo(bx,by);
  ctx.lineTo(cx,cy);
  ctx.closePath();
  ctx.fill();
}

function draw(){
  if (!game) return;

  const {N} = game;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Compute fit scale: pixels per grid unit
  const padPx = 18; // small pixel margin around board
  const size = Math.min(canvas.width, canvas.height);
  const fitCell = (size - 2*padPx) / (N - 1);

  // User zoom multiplies fit
  const cell = fitCell * view.zoom;

  // World half-extent around the board center in grid units
  const boardW = (N - 1) * cell;
  const boardH = (N - 1) * cell;

  // Board origin (top-left) in pixels, centered, then panned
  // Pan is stored in world grid units, convert to pixels by * cell
  const originX = (canvas.width  - boardW) * 0.5 - view.panX * cell;
  const originY = (canvas.height - boardH) * 0.5 - view.panY * cell;

  // Helper: world->screen
  function sx(x){ return originX + x * cell; }
  function sy(y){ return originY + y * cell; }

  // dots (density throttled)
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = "#0b1530";
  const step = N > 140 ? 2 : 1;
  for (let y=0;y<N;y+=step){
    for (let x=0;x<N;x+=step){
      const px = sx(x), py = sy(y);
      ctx.beginPath();
      ctx.arc(px, py, 1.0, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();

  // arrows

  for (const a of game.arrows){
    if (!a.alive) continue;

    const isMoving = game.anim && game.anim.arrowId === a.id;
    const color = a.blocked ? "#b33" : "#0b1530";

    ctx.lineWidth   = Math.max(2.0, cell * 0.28);
    ctx.lineJoin    = "miter";
    ctx.miterLimit  = 10;
    ctx.lineCap     = "butt";
    ctx.strokeStyle = color;

    const chain = isMoving ? interpChainForDraw() : a.chain;
    const n = chain.length;
    if (n < 2) continue;

    const p0 = chain[n-2], p1 = chain[n-1];
    const ux = Math.sign(p1.x - p0.x), uy = Math.sign(p1.y - p0.y);

    const tipX = sx(p1.x), tipY = sy(p1.y);
    const headLen = Math.max(9, cell * 0.9);
    const headW   = headLen * 0.55;
    const baseX = tipX - ux * headLen;
    const baseY = tipY - uy * headLen;

    // draw each segment separately
    for (let i=1;i<n;i++){
      const q0 = chain[i-1];
      const q1 = chain[i];

      let x0 = sx(q0.x), y0 = sy(q0.y);
      let x1 = sx(q1.x), y1 = sy(q1.y);

      // shorten last segment to stop at head base
      if (i === n-1){
        x1 = baseX;
        y1 = baseY;
      }

      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }

    drawArrowHead(ctx, tipX, tipY, ux, uy, headLen, headW, color);
  }

}


/* ---------- Input ---------- */
canvas.addEventListener("pointerdown",(e)=>{
  if (!game) return;

  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(canvas.width/rect.width);
  const y=(e.clientY-rect.top)*(canvas.height/rect.height);

  // If SHIFT is held, pan always. Otherwise: click arrow, else pan.
  const id = (game.arrows.length === 0 || game.anim) ? null : pickArrowAt(x,y);

  if (!e.shiftKey && id!=null){
    tryClickArrow(id);
    return;
  }

  // start panning
  view.isPanning = true;
  canvas.setPointerCapture(e.pointerId);

  view.panStart = {
    x0: x,
    y0: y,
    panX0: view.panX,
    panY0: view.panY
  };
});

canvas.addEventListener("pointermove",(e)=>{
  if (!view.isPanning || !view.panStart || !game) return;

  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(canvas.width/rect.width);
  const y=(e.clientY-rect.top)*(canvas.height/rect.height);

  const {N} = game;
  const padPx = 18;
  const size = Math.min(canvas.width, canvas.height);
  const fitCell = (size - 2*padPx) / (N - 1);
  const cell = fitCell * view.zoom;

  const dxPx = x - view.panStart.x0;
  const dyPx = y - view.panStart.y0;

  // convert pixels -> world grid units
  view.panX = view.panStart.panX0 - dxPx / cell;
  view.panY = view.panStart.panY0 - dyPx / cell;

  draw();
});

canvas.addEventListener("pointerup",(e)=>{
  if (!view.isPanning) return;
  view.isPanning = false;
  view.panStart = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
});
canvas.addEventListener("pointercancel", ()=>{
  view.isPanning = false;
  view.panStart = null;
});


/* ---------- UI ---------- */
function resetGame(){
  const N = clampInt(+document.getElementById("nIn").value, 20, 200);
  const seed = (+document.getElementById("sIn").value) | 0;
  startSearch({ N, seed });
}
function fitCanvasToWindow(){
  const header = document.querySelector("header");
  const h = header ? header.getBoundingClientRect().height : 0;

  const w = window.innerWidth;
  const availH = window.innerHeight - h;

  const side = Math.max(260, Math.min(w, availH) - 16); // margin
  canvas.style.width = side + "px";
  canvas.style.height = side + "px";

  // keep internal resolution crisp on HiDPI
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(side * dpr);
  canvas.height = Math.floor(side * dpr);

  draw();
}

function setZoom(z){
  // clamp and update HUD
  view.zoom = Math.max(0.25, Math.min(4.0, z));
  const pct = Math.round(view.zoom * 100);
  const el = document.getElementById("zoomTxt");
  if (el) el.textContent = pct + "%";
  draw();
}

function resetViewFit(){
  // Fit means: zoom=1 and pan centered
  view.panX = 0;
  view.panY = 0;
  setZoom(1.0);
}

document.getElementById("newBtn").addEventListener("click", ()=>{
  document.getElementById("sIn").value = (Math.random()*2**31)|0;
  resetGame();
});
document.getElementById("zoomInBtn").addEventListener("click", ()=>{
  setZoom(view.zoom * 1.2);
});
document.getElementById("zoomOutBtn").addEventListener("click", ()=>{
  setZoom(view.zoom / 1.2);
});
document.getElementById("zoomResetBtn").addEventListener("click", ()=>{
  resetViewFit();
});
window.addEventListener("resize", fitCanvasToWindow);
/* ---------- Boot ---------- */
makePool();
setStatus("Idle");
fitCanvasToWindow();
resetViewFit();
resetGame();
</script>
